# Автопроверка при каждой загрузке: тесты и метрики сервера (verify.py), сборка интерфейса, сборка Docker-образа.
name: CI
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: backend/requirements.txt }
      - run: pip install -r backend/requirements.txt
      # тесты + метрики против базовых подходов + проверка на реальной фабрике + выгрузка JSON/CSV
      - run: python verify.py
        env: { PYTHONIOENCODING: utf-8 }
      - uses: actions/upload-artifact@v4
        with: { name: results, path: results/ }
  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm run build
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t allur-flow .
      - name: Сервер в контейнере отвечает
        run: |
          docker run -d --name app -p 8000:8000 allur-flow
          for i in $(seq 1 60); do curl -fs localhost:8000/api/health && exit 0; sleep 2; done
          docker logs app; exit 1
